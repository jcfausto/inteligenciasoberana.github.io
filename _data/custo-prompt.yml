      en: "Cottier, B. et al. (2024). “The rising costs of training frontier AI models.” arXiv:2405.21015 / Epoch AI. GPT-4: ~US$ 40 million (final-run hardware+energy) to ~US$ 41–78 million with staff; Gemini Ultra: ~US$ 30–191 million depending on method."
