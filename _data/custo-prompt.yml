      en: "Luccioni, A. S., Jernite, Y. & Strubell, E. (2024). “Power Hungry Processing: Watts Driving the Cost of AI Deployment?” FAccT / arXiv:2311.16863. Generative inference uses orders of magnitude more energy than discriminative tasks; BLOOM-176B ~0.004 kWh/query on a research cluster."
