      en: "Li, P., Yang, J., Islam, M. A. & Ren, S. (2023/2025). “Making AI Less ‘Thirsty’.” arXiv:2304.03271 / Communications of the ACM. GPT-3 training: ~5.4 million liters; ~500 ml of water every 10–50 median replies."
