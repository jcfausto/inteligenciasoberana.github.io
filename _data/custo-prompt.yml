      en: "Perrigo, B. (18 Jan. 2023). “OpenAI Used Kenyan Workers on Less Than $2 Per Hour to Make ChatGPT Less Toxic.” TIME. Sama annotators in Kenya: US$ 1.32–2.00/hour; OpenAI paid the vendor US$ 12.50/hour."
