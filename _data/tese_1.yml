number: "01"
title:
  pt: Velocidade de Adoção
  en: Adoption Velocity
subtitle:
  pt: A tecnologia chegou antes da sociedade
  en: The technology arrived before society did
body:
  pt:
    - |
      A inteligência artificial generativa quebrou todos os parâmetros históricos de adoção tecnológica. Enquanto tecnologias como a eletricidade, o computador pessoal e o smartphone levaram décadas para alcançar a maioria da população, o ChatGPT alcançou 100 milhões de usuários ativos em dois meses, e em 2025 o modelo já era utilizado por 54,6% dos adultos nos Estados Unidos<sup class="cite"><a href="relatorio.html#ref-2">[2]</a></sup>.
    - |
      No Brasil, essa curva é ainda mais comprimida devido a uma sociedade altamente conectada via dispositivos móveis. Com conexões móveis cobrindo 102% da população, e o WhatsApp alcançando 93,9% da audiência online nacional<sup class="cite"><a href="relatorio.html#ref-4">[4]</a></sup>, as ferramentas de inteligência artificial são injetadas diretamente na rotina comercial de milhões de brasileiros sem que haja qualquer preparo, regulação ou governança de dados madura. Enquanto 54,6% dos adultos nos EUA usavam IA generativa no fim de 2025<sup class="cite"><a href="relatorio.html#ref-2">[2]</a></sup>, <strong>71% dos adultos conectados no Brasil já utilizaram chatbots</strong> — um salto de 25 pontos desde 2023, acima da média global de 62%<sup class="cite"><a href="relatorio.html#ref-27">[27]</a></sup>. O país é o segundo no mundo em uso diário de IA generativa (51,6%)<sup class="cite"><a href="relatorio.html#ref-28">[28]</a></sup> e o terceiro maior mercado do ChatGPT, com 310 milhões de visitas mensais e 45,8 milhões de usuários ativos semanais<sup class="cite"><a href="relatorio.html#ref-30">[30]</a></sup>. Quarenta e três por cento da população ampla já usa ferramentas de geração de texto no cotidiano<sup class="cite"><a href="relatorio.html#ref-29">[29]</a></sup>.
    - |
      O <a href="https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/l15211.htm" class="text-terracotta hover:underline" target="_blank" rel="noopener noreferrer">ECA Digital</a> (Lei nº 15.211/2025), em vigor desde março de 2026, é uma reação tardia no mesmo sentido do <button type="button" class="glossary-term" data-glossary="kosa" aria-expanded="false">KOSA</button>: chega depois que a infraestrutura cognitiva de uma geração já foi reescrita<sup class="cite"><a href="relatorio.html#ref-26">[26]</a></sup><sup class="cite"><a href="relatorio.html#ref-25">[25]</a></sup>. A lei prevê verificação etária a cada acesso e multas de até 10% do faturamento, mas sua eficácia esbarra nos limites da fiscalização estatal e depende de corresponsabilidade entre plataformas, Estado e sociedade civil<sup class="cite"><a href="relatorio.html#ref-25">[25]</a></sup>.
  en:
    - |
      Generative artificial intelligence has shattered every historical benchmark for technological adoption. While legacy innovations like electricity, personal computers, and smartphones required decades to diffuse to the public, ChatGPT reached 100 million active users in just two months, and by 2025, over 54.6% of US adults had adopted generative tools<sup class="cite"><a href="relatorio.html#ref-2">[2]</a></sup>.
    - |
      In Brazil, this adoption curve is compressed even further due to a highly connected, mobile-first society. With cellular connections covering 102% of the population, and WhatsApp reaching 93.9% of the online audience<sup class="cite"><a href="relatorio.html#ref-4">[4]</a></sup>, AI tools are injected directly into the daily lives of millions of citizens without mature data governance, state regulation, or safety rails. While 54.6% of US adults used generative AI by late 2025<sup class="cite"><a href="relatorio.html#ref-2">[2]</a></sup>, <strong>71% of connected adults in Brazil have already used AI chatbots</strong> — a 25-point jump since 2023, above the 62% global average<sup class="cite"><a href="relatorio.html#ref-27">[27]</a></sup>. Brazil ranks second worldwide in daily generative-AI use (51.6%)<sup class="cite"><a href="relatorio.html#ref-28">[28]</a></sup> and is the third-largest ChatGPT market, with 310 million monthly visits and 45.8 million weekly active users<sup class="cite"><a href="relatorio.html#ref-30">[30]</a></sup>. Forty-three percent of the broader population already uses text-generation tools in daily life<sup class="cite"><a href="relatorio.html#ref-29">[29]</a></sup>.
    - |
      The <a href="https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/l15211.htm" class="text-terracotta hover:underline" target="_blank" rel="noopener noreferrer">ECA Digital</a> (Law No. 15,211/2025), in force since March 2026, is a belated reaction in the same register as <button type="button" class="glossary-term" data-glossary="kosa" aria-expanded="false">KOSA</button>: it arrives after a generation’s cognitive infrastructure has already been rewritten<sup class="cite"><a href="relatorio.html#ref-26">[26]</a></sup><sup class="cite"><a href="relatorio.html#ref-25">[25]</a></sup>. The statute requires age verification at every access and fines of up to 10% of revenue, but its effectiveness hits the limits of state enforcement and depends on co-responsibility among platforms, the state, and civil society<sup class="cite"><a href="relatorio.html#ref-25">[25]</a></sup>.
