number: "03"
title:
  pt: Pressão no Trabalho
  en: The Labor Market Squeeze
subtitle:
  pt: O choque cai sobre quem já é precário
  en: The shock falls on those already in precarity
body:
  pt:
    - |
      Diferente das revoluções industriais do passado, que automatizaram o trabalho manual, a <strong>IA automatiza tarefas de alta cognição</strong>. O fechamento das portas de entrada empurra jovens para plataformas algorítmicas de serviços temporários, as "gigs": sobrevivência de curto prazo sem garantias sociais, saúde ou previdência, o ônus inteiro recai sobre o indivíduo, não sobre empregadores ou o Estado. Esse choque atinge o Brasil em um cenário de profunda precarização: com <strong>40% de nossa força de trabalho atuando na informalidade</strong>, e o Congresso tendo removido as salvaguardas trabalhistas mínimas do <a href="https://www.camara.leg.br/proposicoesWeb/fichadetramitacao?idProposicao=2487262" class="text-terracotta hover:underline" target="_blank" rel="noopener noreferrer">projeto de lei original da inteligência artificial</a> (<a href="/marco-legal.html" class="text-terracotta hover:underline">radar</a>), o trabalhador informal está completamente desprotegido.
    - |
      Para esses trabalhadores, a automação de postos básicos de atendimento, suporte e análise não representa uma transição de carreira corporativa; representa a eliminação repentina e brutal de micro-gigs e serviços digitais de entrada que garantem o sustento básico de suas famílias.
  en:
    - |
      Unlike legacy industrial revolutions that automated physical tasks, generative AI targets cognitive work. As traditional entry-level pathways evaporate, young workers migrate toward algorithmic gig platforms: short-term survival with no social guarantees, healthcare, or pension contributions, shifting the entire burden onto the individual. This technological shock is colliding with Brazil's highly precarized labor market, where <strong>40% of the active workforce operates in the informal economy</strong>, completely lacking employer-sponsored pension schemes or social safety nets.
    - |
      Because the latest version of <a href="https://www.camara.leg.br/proposicoesWeb/fichadetramitacao?idProposicao=2487262" class="text-terracotta hover:underline" target="_blank" rel="noopener noreferrer">PL 2338/2023</a> (<a href="/marco-legal.html" class="text-terracotta hover:underline">radar</a>) stripped out minimum labor safeguards, informal workers are left completely exposed. The automation of customer service, basic writing, and administrative tasks does not mean "losing a corporate desk job"—it means the sudden elimination of low-barrier digital micro-gigs that keep families out of poverty.
