points:
- id: risco
  status: no_texto
  title:
    pt: Classificação por risco
    en: Risk classification
  summary:
    pt: O texto aprovado no Senado separa sistemas por risco à vida e aos direitos fundamentais —
      excessivo (proibido), alto (regulado) e demais — e distingue IA de IA generativa.
    en: The Senate-approved text ranks systems by risk to life and fundamental rights — excessive
      (banned), high (regulated), and the rest — and distinguishes AI from generative AI.
- id: proibicoes
  status: no_texto
  title:
    pt: Proibições de risco excessivo
    en: Excessive-risk bans
  summary:
    pt: Ficam vedadas armas autônomas que selecionam e atacam alvos sem intervenção humana, sistemas
      para abuso sexual de crianças e adolescentes, e avaliação preditiva de personalidade para prever
      crimes.
    en: Banned uses include autonomous weapons that select and strike targets without a human, systems
      for child sexual abuse, and personality scoring to predict crime.
- id: biometria
  status: em_disputa
  title:
    pt: Biometria em espaço público
    en: Public-space biometrics
  summary:
    pt: Câmeras com reconhecimento em espaços públicos ficam restritas a busca de vítimas, desaparecidos
      e recaptura de foragidos, com autorização judicial e limite de pena.
    en: Public facial-recognition cameras are limited to searching for victims, missing people, and
      recapturing fugitives, with a court order and a penalty threshold.
  dispute:
    pt: O recorte ainda divide convidados entre vedação ampla e exceções de segurança pública.
    en: Invitees still split between a broad ban and public-security exceptions.
- id: governanca
  status: em_disputa
  title:
    pt: ANPD e o SIA
    en: ANPD and the SIA
  summary:
    pt: A Autoridade Nacional de Proteção de Dados coordenaria o Sistema Nacional de Regulação e Governança
      de Inteligência Artificial, com autoridades setoriais e comitês de especialistas.
    en: The National Data Protection Authority would coordinate the National AI Regulation and Governance
      System, with sector regulators and expert committees.
  dispute:
    pt: Parte dos convidados defende um órgão coordenador; outra parte teme concentração e prefere
      arranjo setorial.
    en: Some invitees want a coordinating body; others fear concentration and prefer a sector-by-sector
      setup.
- id: direitos
  status: no_texto
  title:
    pt: Direitos de quem é afetado
    en: Rights of affected people
  summary:
    pt: Quem sofre decisão automatizada relevante teria direito a informação, contestação e revisão
      humana.
    en: Anyone subject to a material automated decision would have rights to information, challenge,
      and human review.
- id: responsabilidade
  status: em_disputa
  title:
    pt: Responsabilidade civil
    en: Civil liability
  summary:
    pt: O marco prevê regras de responsabilidade civil para danos causados por sistemas de IA, em
      diálogo com o Código Civil e o CDC.
    en: The bill sets civil-liability rules for harm from AI systems, alongside the Civil Code and
      the Consumer Code.
  dispute:
    pt: O desenho exato — nexo, ônus da prova, teto — ainda não fechou na Câmara.
    en: The exact design — causation, burden of proof, caps — is still open in the Chamber.
- id: autoral
  status: em_disputa
  title:
    pt: Direitos autorais
    en: Copyright
  summary:
    pt: Uso sem fins comerciais por pesquisa, jornalismo, museus, arquivos, bibliotecas e educação
      seria livre; uso comercial geraria remuneração ao titular.
    en: Non-commercial use by research, journalism, museums, archives, libraries, and education would
      be free; commercial use would trigger remuneration.
  dispute:
    pt: 'É o principal impasse da Câmara: criadores pedem remuneração; plataformas e startups temem
      trava ao treino.'
    en: 'This is the Chamber’s main deadlock: creators want pay; platforms and startups fear a training
      freeze.'
- id: trabalho
  status: removido
  title:
    pt: Salvaguardas trabalhistas
    en: Labor safeguards
  summary:
    pt: O texto inicial buscava proteções mínimas para o mercado de trabalho. O processo na Câmara
      retirou essas salvaguardas.
    en: The early draft sought baseline labor-market protections. The Chamber process stripped those
      safeguards.
  dispute:
    pt: Com cerca de 40% da força de trabalho na informalidade, a omissão deixa o trabalhador precário
      exposto à automação.
    en: With about 40% of the workforce informal, the omission leaves precarious workers exposed to
      automation.
- id: sancoes
  status: no_texto
  title:
    pt: Sanções
    en: Sanctions
  summary:
    pt: O texto do Senado prevê multas de até 2% do faturamento, limitadas a R$ 50 milhões por infração,
      além de outras medidas administrativas.
    en: The Senate text provides for fines of up to 2% of revenue, capped at R$ 50 million per offense,
      plus other administrative measures.
