number: "02"
title:
  pt: O Abismo Regulatório
  en: The Regulatory Deficit
subtitle:
  pt: O Estado não acompanha o capital privado
  en: The state cannot keep pace with private capital
body:
  pt:
    - |
      Enquanto as corporações privadas investem quantias astronômicas, com os quatro maiores <button type="button" class="glossary-term" data-glossary="hiperscalers" aria-expanded="false">hiperscalers</button> globais direcionando mais de <strong>US$ 720 bilhões</strong> em <button type="button" class="glossary-term" data-glossary="capex" aria-expanded="false">CapEx</button> para 2026<sup class="cite"><a href="relatorio.html#ref-5">[5]</a></sup>, as agências públicas reguladoras operam com orçamentos quase simbólicos. O resultado é um desequilíbrio estrutural de poder, onde o Congresso brasileiro, influenciado por intensos lobbies comerciais, adia o <button type="button" class="glossary-term" data-glossary="marco-legal-ia" aria-expanded="false">marco legal da IA</button> (<a href="https://www.camara.leg.br/proposicoesWeb/fichadetramitacao?idProposicao=2487262" class="text-terracotta hover:underline" target="_blank" rel="noopener noreferrer">PL 2338/2023</a> · <a href="/marco-legal.html" class="text-terracotta hover:underline">radar</a>) para o final de 2026<sup class="cite"><a href="relatorio.html#ref-10">[10]</a></sup>.
    - |
      Essa lentidão regulatória deixa a economia nacional altamente exposta. Enquanto 76% das empresas brasileiras mantêm agentes de inteligência artificial em produção, a taxa de incidentes é alarmante: 80% das organizações já foram forçadas a pausar ou reverter uma implantação, e quase 40% destas falhas foram causadas por violações de privacidade ou vazamento de dados críticos<sup class="cite"><a href="relatorio.html#ref-3">[3]</a></sup>.
  en:
    - |
      While private corporations allocate astronomical sums, with the Big Four tech <button type="button" class="glossary-term" data-glossary="hiperscalers" aria-expanded="false">hyperscalers</button> guiding toward a combined <strong>$720 billion to $745 billion</strong> in <button type="button" class="glossary-term" data-glossary="capex" aria-expanded="false">CapEx</button> for 2026 alone<sup class="cite"><a href="relatorio.html#ref-5">[5]</a></sup>, public regulatory bodies operate on shoestring budgets. This asymmetry has mired the Brazilian legislature in a lobbying bottleneck, delaying the vote on the landmark <button type="button" class="glossary-term" data-glossary="marco-legal-ia" aria-expanded="false">AI Legal Framework</button> (<a href="https://www.camara.leg.br/proposicoesWeb/fichadetramitacao?idProposicao=2487262" class="text-terracotta hover:underline" target="_blank" rel="noopener noreferrer">PL 2338/2023</a> · <a href="/marco-legal.html" class="text-terracotta hover:underline">radar</a>) to late 2026<sup class="cite"><a href="relatorio.html#ref-10">[10]</a></sup>.
    - |
      This legislative vacuum has created an unstable environment. While 76% of Brazilian companies aggressively deploy AI agents, the failure rate is staggering: 80% of local organizations have been forced to pause or roll back an AI deployment, with 39% of those failures caused directly by critical data breaches or leaks<sup class="cite"><a href="relatorio.html#ref-3">[3]</a></sup>.
