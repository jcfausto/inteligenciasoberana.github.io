number: "05"
title:
  pt: Alternativa Soberana
  en: A Sovereign Alternative
subtitle:
  pt: Hardware sem <em>mindware</em> é casulo vazio
  en: Hardware without <em>mindware</em> is an empty husk
body:
  pt:
    - |
      O <a href="https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/transformacaodigital/plano-brasileiro-de-inteligencia-artificial" class="text-terracotta hover:underline" target="_blank" rel="noopener noreferrer">Plano Brasileiro de Inteligência Artificial</a> (<button type="button" class="glossary-term" data-glossary="pbia" aria-expanded="false">PBIA</button>), com aporte planejado de <strong>R$ 23 bilhões</strong><sup class="cite"><a href="relatorio.html#ref-19">[19]</a></sup>, promete estabelecer um supercomputador de US$ 1 bilhão e o desenvolvimento de <button type="button" class="glossary-term" data-glossary="llm" aria-expanded="false">LLMs</button> nativos em português. No entanto, infraestrutura física (hardware) sem investimento massivo no capital humano (<button type="button" class="glossary-term" data-glossary="mindware" aria-expanded="false">mindware</button>) é um casulo vazio.
    - |
      O verdadeiro gargalo nacional reside na precariedade estrutural que alimenta a histórica <strong>"<button type="button" class="glossary-term" data-glossary="fuga-cerebros" aria-expanded="false">fuga de cérebros</button>"</strong>: nos últimos anos, o país perdeu cerca de 6.700 cientistas e doutores altamente qualificados para o exterior<sup class="cite"><a href="relatorio.html#ref-15">[15]</a></sup> devido a laboratórios deteriorados e bolsas de pós-graduação miseráveis que não oferecem sequer direitos previdenciários elementares.
    - |
      Paralelamente, a construção de complexos de data centers privados como a <em><button type="button" class="glossary-term" data-glossary="scala-ai-city" aria-expanded="false">Scala AI City</button></em> em Eldorado do Sul<sup class="cite"><a href="relatorio.html#ref-7">[7]</a></sup>, com demanda elétrica autorizada de <strong>4,75 GW</strong> (potência superior à da Usina Hidrelétrica de Jirau, que abastece 40 milhões de pessoas), não é em si o problema. O risco é tratá-la como solução única e reduzir o país a ser somente uma <strong>"<button type="button" class="glossary-term" data-glossary="fazenda-dados" aria-expanded="false">fazenda de dados</button>"</strong>. Enquanto o governo federal concede isenção de 100% de impostos federais para a importação de servidores corporativos por cinco anos<sup class="cite"><a href="relatorio.html#ref-18">[18]</a></sup>, as nossas universidades sofrem cortes crônicos e operam com menos de metade do orçamento discricionário que possuíam em 2014.
  en:
    - |
      The <a href="https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/transformacaodigital/plano-brasileiro-de-inteligencia-artificial" class="text-terracotta hover:underline" target="_blank" rel="noopener noreferrer">Brazilian AI National Plan</a> (<button type="button" class="glossary-term" data-glossary="pbia" aria-expanded="false">PBIA</button>), with a planned budget of <strong>R$ 23 billion</strong><sup class="cite"><a href="relatorio.html#ref-19">[19]</a></sup>, promises a $1 billion supercomputer and native Portuguese language models. However, sovereign hardware without sovereign <button type="button" class="glossary-term" data-glossary="mindware" aria-expanded="false">mindware</button> is a hollow victory.
    - |
      The true bottleneck resides in the systemic starvation of the scientific ecosystem, which has driven a chronic <strong>"<button type="button" class="glossary-term" data-glossary="fuga-cerebros" aria-expanded="false">Brain Drain</button>" (Fuga de Cérebros)</strong> of roughly 6,700 elite scientists and doctors between 2015 and 2022<sup class="cite"><a href="relatorio.html#ref-15">[15]</a></sup>. Everyday research is run by graduate students surviving on precarious, insecure government fellowships ("bolsas") that lack basic labor rights or pension guarantees.
    - |
      Meanwhile, massive private developments like the <strong>4.75 GW <button type="button" class="glossary-term" data-glossary="scala-ai-city" aria-expanded="false">Scala AI City</button></strong> in Eldorado do Sul<sup class="cite"><a href="relatorio.html#ref-7">[7]</a></sup>—which will consume more electricity than the Jirau Hydroelectric Plant (which supplies 40 million citizens)—are not, in themselves, the problem. The risk is treating them as the only solution and reducing Brazil to being only a green-powered "<button type="button" class="glossary-term" data-glossary="fazenda-dados" aria-expanded="false">data farm</button>." The federal government waives import taxes on corporate hardware for five years<sup class="cite"><a href="relatorio.html#ref-18">[18]</a></sup>, while federal universities have had their operational budgets cut by 55% over the past decade.
